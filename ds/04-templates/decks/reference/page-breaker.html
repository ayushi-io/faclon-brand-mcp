<!-- Faclon deck reference slide: page breaker on brand (Figma Design MCP › Layouts, "Page breaker · reference slide, mapped",

     Use as it is. Fill only the data-slot elements with the user's words; keep the backdrop, positions and sizes.

     mark the item the user wants highlighted with the --accent modifier. The logo is the white Faclon Labs logo; use the
